<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu HUID - Final All Set</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, collectionGroup, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOfiR4hEdEphcrd5gPtBY1CA5oGP43V8",
  authDomain: "vyapar-bandhu-huid-rajistard.firebaseapp.com",
  projectId: "vyapar-bandhu-huid-rajistard",
  storageBucket: "vyapar-bandhu-huid-rajistard.firebasestorage.app",
  messagingSenderId: "788156920221",
  appId: "1:788156920221:web:41b3c9dd4610327fe1ff74",
  measurementId: "G-1VV3J21Y3B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const RAZORPAY_KEY = "rzp_live_TSSLcwOZn8V7er";
let userEmail=null;
let walletBalance=0;
let shopProfile=null;

window.login=async()=>{ const r=await signInWithPopup(auth,provider); userEmail=r.user.email; }
window.logout=()=>signOut(auth).then(()=>location.reload());
onAuthStateChanged(auth,async(u)=>{
 if(u){ userEmail=u.email; document.getElementById('loginBox').style.display='none'; document.getElementById('mainBox').style.display='block'; document.getElementById('userEmail').innerText='Login: '+userEmail; await loadWallet(); await loadShopProfile(); loadAll(); }
 else{ document.getElementById('loginBox').style.display='block'; document.getElementById('mainBox').style.display='none'; }
});

async function loadWallet(){
  const ref=doc(db,"wallets",userEmail);
  const snap=await getDoc(ref);
  if(snap.exists()){ walletBalance=snap.data().balance||0; }
  else { await setDoc(ref,{balance:0,email:userEmail}); walletBalance=0; }
  document.getElementById('walletBal').innerText="₹"+walletBalance;
  document.getElementById('walletBal2').innerText="Balance: ₹"+walletBalance;
}

async function loadShopProfile(){
  const ref=doc(db,"shops",userEmail);
  const snap=await getDoc(ref);
  if(snap.exists()){
    shopProfile=snap.data();
    document.getElementById('shopDisplay').innerHTML = `<div style="display:flex;align-items:center;gap:10px;background:#fff3cd;padding:10px;border-radius:10px;border:2px solid #ff8f00"><img src="${shopProfile.logo||'https://via.placeholder.com/50'}" style="width:50px;height:50px;border-radius:50%;object-fit:cover"><div style="text-align:left"><b>${shopProfile.shopName}</b><br><span style="font-size:12px">📞 ${shopProfile.shopMobile}</span><br><span style="font-size:11px">📍 ${shopProfile.shopAddress}</span></div><button onclick="editShop()" style="width:auto;margin-left:auto;background:#333;padding:6px 12px;font-size:12px">Edit</button></div>`;
    document.getElementById('shopSetupCard').style.display='none';
    document.getElementById('sname').value=shopProfile.shopName||''; document.getElementById('smobile').value=shopProfile.shopMobile||''; document.getElementById('saddress').value=shopProfile.shopAddress||'';
  } else {
    document.getElementById('shopDisplay').innerHTML='<p style="color:red;text-align:center">⚠️ पहले दुकान Setup करो!</p>';
    document.getElementById('shopSetupCard').style.display='block';
  }
}
window.editShop=()=>{ document.getElementById('shopSetupCard').style.display='block'; }
window.saveShopProfile=async()=>{
  const shopName=document.getElementById('sname').value.trim(); const shopMobile=document.getElementById('smobile').value.trim(); const shopAddress=document.getElementById('saddress').value.trim();
  if(!shopName||!shopMobile){ alert('दुकान का नाम और मोबाइल डालो!'); return; }
  let logo=''; const file=document.getElementById('slogo').files[0]; if(file) logo=await toBase64(file); else if(shopProfile && shopProfile.logo) logo=shopProfile.logo;
  const data={ shopName, shopMobile, shopAddress, logo, email:userEmail, updated:new Date().toLocaleString('hi-IN') };
  await setDoc(doc(db,'shops',userEmail), data); shopProfile=data; alert('✅ दुकान Save हो गयी!'); loadShopProfile();
}

window.rechargeWallet=()=>{
  const amt=parseInt(document.getElementById('rechargeAmt').value); if(!amt || amt<10){ alert("कम से कम ₹10 डालो"); return; }
  var options={ "key": RAZORPAY_KEY, "amount": amt*100, "currency": "INR", "name": "Vyapar Bandhu Wallet", "description": "Wallet Recharge ₹"+amt,
    "handler": async function(response){
      const ref=doc(db,"wallets",userEmail); try{ await updateDoc(ref,{balance: increment(amt)}); }catch(e){ await setDoc(ref,{balance:amt,email:userEmail}); }
      await addDoc(collection(db,"wallet_tx",userEmail,"tx"),{type:"CREDIT",amount:amt,paymentId:response.razorpay_payment_id,time:new Date()}); alert("✅ Recharge Success! ₹"+amt+" Add हो गया"); loadWallet();
    }, "prefill": { "email": userEmail }, "theme": { "color": "#ff8f00" }
  }; var rzp=new Razorpay(options); rzp.open();
}

window.generateNewHUID=async()=>{
  try{
    if(!shopProfile){ alert("⚠️ पहले दुकान Setup करो!"); document.getElementById('shopSetupCard').style.display='block'; return; }
    if(walletBalance<20){ alert("⚠️ Wallet Balance कम है! Balance: ₹"+walletBalance); return; }
    let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let newHuid=''; for(let i=0;i<6;i++) newHuid+=chars[Math.floor(Math.random()*chars.length)];
    document.getElementById('ihuid').value=newHuid;
    const ref=doc(db,"wallets",userEmail);
    try{ await updateDoc(ref,{balance: increment(-20)}); }catch(e){ await setDoc(ref,{balance:walletBalance-20,email:userEmail}); }
    walletBalance-=20;
    document.getElementById('walletBal').innerText="₹"+walletBalance;
    document.getElementById('walletBal2').innerText="Balance: ₹"+walletBalance;
    await addDoc(collection(db,"wallet_tx",userEmail,"tx"),{type:"DEBIT",amount:20,reason:"New HUID: "+newHuid,time:new Date()});
    document.getElementById('huidStatus').innerHTML='✅ नया HUID: <b style="color:red">'+newHuid+'</b><br><span style="color:green">₹20 कट गया। बचा: ₹'+walletBalance+'</span>';
  }catch(err){ alert("Error: "+err.message); }
}

window.saveBill=async()=>{
  if(!shopProfile){ alert("⚠️ पहले दुकान Setup करो!"); return; }
  const huid=document.getElementById('ihuid').value.trim().toUpperCase(); if(!huid){alert('HUID बनाओ!');return}
  const karat=document.getElementById('ikarat').value; if(!karat){alert('कैरेट Select करो!');return}
  const file=document.getElementById('iphoto').files[0]; let photo=''; if(file) photo=await toBase64(file);
  const data={ cname:cname.value, caddress:caddress.value, cmobile:cmobile.value, iname:iname.value, iweight:iweight.value, irate:irate.value, imaking:imaking.value, huid:huid, hallmark:ihallmark.value, karat:karat, shopName:shopProfile.shopName, shopMobile:shopProfile.shopMobile, shopAddress:shopProfile.shopAddress, shopLogo:shopProfile.logo, photo:photo, date:new Date().toLocaleString('hi-IN'), owner:userEmail };
  await setDoc(doc(db,'jewellery_bills',userEmail,'bills',huid), data); alert('✅ '+shopProfile.shopName+' के नाम से Save! Total Bill Ready!'); document.getElementById('ihuid').value=''; document.getElementById('huidStatus').innerHTML=''; loadAll();
}
window.searchBill=async()=>{
  const qText=document.getElementById('search').value.trim().toUpperCase() || document.getElementById('search2').value.trim().toUpperCase();
  if(!qText){ loadAll(); return; } const q=query(collectionGroup(db,'bills'), where('huid','==',qText)); const snap=await getDocs(q); render(snap);
}
window.loadAll=async()=>{ if(!userEmail) return; const snap=await getDocs(collection(db,'jewellery_bills',userEmail,'bills')); render(snap, true); }

function render(snap, isMain=false){
  let html=''; snap.forEach(d=>{ const b=d.data();
    const karatBadge = b.karat? `<span style="background:#ff8f00;color:white;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:5px">${b.karat}</span>` : '';
    const shopHead = b.shopName? `<div style="display:flex;align-items:center;gap:8px;background:#fff8e1;padding:8px;border-radius:8px;margin-bottom:8px;border:2px solid #ff8f00"><img src="${b.shopLogo||'https://via.placeholder.com/40'}" style="width:40px;height:40px;border-radius:50%;object-fit:cover"><div><b style="color:#e65100">${b.shopName}</b><br><span style="font-size:11px">📞 ${b.shopMobile}<br>📍 ${b.shopAddress||''}</span></div><span style="margin-left:auto;background:green;color:white;padding:2px 6px;border-radius:10px;font-size:10px">Verified</span></div>` : '';
    let w = parseFloat(b.iweight) || 0; let r = parseFloat(b.irate) || 0; let mPercent = parseFloat(b.imaking) || 0;
    let goldValue = w * r;
    let makingValue = (goldValue * mPercent) / 100;
    let total = goldValue + makingValue;
    html+=`<div class="bill">${shopHead}${b.photo?`<img src="${b.photo}">`:''}<h3>💎 ${b.iname} - ${b.iweight} ${karatBadge}</h3><p><b>ग्राहक:</b> ${b.cname} | ${b.cmobile}<br><b>HUID:</b> <span style="color:red;font-size:20px">${b.huid}</span><br><b>कैरेट:</b> ${b.karat||''}<br><b>Hallmark:</b> ${b.hallmark||''}<br><b>वजन:</b> ${b.iweight}<br><b>सोने का रेट:</b> ₹${b.irate}/gram<br><b>सोने का दाम:</b> ₹${goldValue.toLocaleString('en-IN')}<br><b>Making:</b> ${b.imaking}% = ₹${makingValue.toLocaleString('en-IN')}<br><b style="font-size:18px;background:yellow;padding:3px 8px;border-radius:5px">💰 Total: ₹${total.toLocaleString('en-IN')}</b><br><span style="font-size:11px">📍 ${b.shopAddress||''} | 📅 ${b.date}</span></p></div>`; });
  const el = isMain? document.getElementById('resultMain') : document.getElementById('result');
  if(el) el.innerHTML=html||'<p style="text-align:center">कोई Bill नहीं मिला</p>'; if(!isMain && document.getElementById('resultMain')) document.getElementById('resultMain').innerHTML=html;
}
function toBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.readAsDataURL(f); r.onload=()=>res(r.result); r.onerror=rej; }); }
</script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#fff8e1;padding:15px}.card{background:white;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:15px}input,select{width:100%;padding:12px;margin:6px 0;border:1.5px solid #ffb300;border-radius:8px}button{width:100%;padding:14px;background:linear-gradient(45deg,#ff8f00,#ff6f00);color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.btn-green{background:linear-gradient(45deg,#00c853,#009624)}.btn-blue{background:linear-gradient(45deg,#1976d2,#0d47a1)}.bill{border:2px solid #ff8f00;border-radius:12px;padding:12px;margin-top:12px;background:white}.bill img{width:100%;max-height:220px;object-fit:contain}.wallet{background:linear-gradient(135deg,#00c853,#009624);color:white;padding:15px;border-radius:15px;margin-bottom:15px;text-align:center}</style>
</head>
<body>
<h2 style="text-align:center">💎 Vyapar Bandhu HUID - All Set 💎</h2>
<div id="loginBox" class="card" style="text-align:center"><h3>🔐 Gmail Login करो</h3><button class="btn-green" onclick="login()">Gmail से Login</button><div style="margin-top:20px"><p><b>ग्राहक हो? HUID से Bill देखो</b></p><input id="search" placeholder="🔍 HUID डालो" oninput="searchBill()"><div id="result"></div></div></div>
<div id="mainBox" style="display:none">
<p id="userEmail" style="text-align:center;font-weight:bold"></p>
<div id="shopDisplay" class="card" style="padding:10px"></div>
<div id="shopSetupCard" class="card" style="border:3px solid #1976d2"><h3 style="margin-top:0;color:#0d47a1">🏪 दुकान Admin Panel - एक बार सेट करो</h3><input id="sname" placeholder="🏪 दुकान का नाम *"><input id="smobile" placeholder="📞 दुकान मोबाइल *"><input id="saddress" placeholder="📍 दुकान का पता"><label style="font-size:12px;font-weight:bold">दुकान का Logo:</label><input type="file" id="slogo" accept="image/*"><button class="btn-blue" onclick="saveShopProfile()">💾 दुकान Save करो</button></div>
<div class="wallet"><h3 style="margin:0">💰 Wallet Balance</h3><h1 id="walletBal" style="font-size:36px;margin:5px 0">₹0</h1><p style="margin:0;font-size:13px">हर नया HUID = ₹20 कटेगा</p><div style="display:flex;gap:8px;margin-top:10px;background:white;border-radius:10px;padding:5px"><input id="rechargeAmt" type="number" placeholder="100, 500" style="flex:1;margin:0;border:none;color:black"><button onclick="rechargeWallet()" style="width:100px;margin:0;background:black">Recharge</button></div></div>
<button onclick="logout()" style="background:#333">Logout</button><input id="search2" placeholder="🔍 HUID Search" oninput="searchBill()">
<div class="card"><h3>नया Bill - <span id="walletBal2" style="color:green">Balance: ₹0</span></h3><input id="cname" placeholder="ग्राहक नाम"><input id="caddress" placeholder="पता"><input id="cmobile" placeholder="मोबाइल"><input id="iname" placeholder="सामान"><input id="iweight" placeholder="वजन (10)"><label style="font-weight:bold;margin-top:8px;display:block">कैरेट Select करो ✨</label><select id="ikarat" style="background:#fff8e1;font-weight:bold"><option value="">-- कैरेट Select करो --</option><option value="24K (999) - शुद्ध सोना">24K (999) - शुद्ध सोना</option><option value="22K (916) - सबसे ज्यादा बिकने वाला">22K (916) - सबसे ज्यादा बिकने वाला</option><option value="20K (833)">20K (833)</option><option value="18K (750)">18K (750)</option><option value="14K (585)">14K (585)</option><option value="10K (417)">10K (417)</option></select><input id="irate" placeholder="रेट (₹/gram)"><input id="imaking" placeholder="Making Charges % (जैसे 10)"><input id="ihuid" placeholder="HUID" readonly style="background:#fff3cd;font-weight:bold"><button class="btn-green" onclick="generateNewHUID()">✨ नया HUID बनाओ (₹20 कटेगा)</button><p id="huidStatus"></p><input id="ihallmark" placeholder="Hallmark No."><input type="file" id="iphoto" accept="image/*"><button onclick="saveBill()">💾 Cloud में Save</button></div>
<div id="resultMain"></div>
</div>
</body>
</html>
