<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu HUID - Final</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, query, where, collectionGroup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUOfiR4hEdEphcrd5gPtBY1CA5oGP43V8",
  authDomain: "vyapar-bandhu-huid-rajistard.firebaseapp.com",
  projectId: "vyapar-bandhu-huid-rajistard",
  storageBucket: "vyapar-bandhu-huid-rajistard.firebasestorage.app",
  messagingSenderId: "788156920221",
  appId: "1:788156920221:web:41b3c9dd4610327fe1ff74",
  measurementId: "G-1VV3J21Y3B"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let userEmail=null;

window.login=async()=>{ const r=await signInWithPopup(auth,provider); userEmail=r.user.email; }
window.logout=()=>signOut(auth).then(()=>location.reload());
onAuthStateChanged(auth,(u)=>{
 if(u){ userEmail=u.email; document.getElementById('loginBox').style.display='none'; document.getElementById('mainBox').style.display='block'; document.getElementById('userEmail').innerText='Login: '+userEmail; loadAll(); }
 else{ document.getElementById('loginBox').style.display='block'; document.getElementById('mainBox').style.display='none'; }
});

window.generateNewHUID=async()=>{
  let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', newHuid, exists=true;
  while(exists){
    newHuid=''; for(let i=0;i<6;i++) newHuid+=chars[Math.floor(Math.random()*chars.length)];
    const q=query(collectionGroup(db,'bills'), where('huid','==',newHuid)); const s=await getDocs(q); if(s.empty) exists=false;
  }
  document.getElementById('ihuid').value=newHuid;
  document.getElementById('huidStatus').innerHTML='✅ नया HUID: <b style="color:red">'+newHuid+'</b> - ये दुनिया में नहीं है!';
}

window.saveBill=async()=>{
  const huid=document.getElementById('ihuid').value.trim().toUpperCase(); if(!huid){alert('HUID बनाओ!');return}
  const q=query(collectionGroup(db,'bills'), where('huid','==',huid)); const snap=await getDocs(q);
  if(!snap.empty){ alert('⚠️ ये HUID पहले से है!'); return; }
  const file=document.getElementById('iphoto').files[0]; let photo=''; if(file) photo=await toBase64(file);
  const data={ cname:cname.value, caddress:caddress.value, cmobile:cmobile.value, iname:iname.value, iweight:iweight.value, irate:irate.value, imaking:imaking.value, huid:huid, hallmark:ihallmark.value, photo:photo, date:new Date().toLocaleString('hi-IN'), owner:userEmail };
  await setDoc(doc(db,'jewellery_bills',userEmail,'bills',huid), data);
  alert('✅ Cloud में Save! अब कोई भी Search कर सकता है!'); loadAll();
}

window.searchBill=async()=>{
  const qText=document.getElementById('search').value.trim().toUpperCase() || document.getElementById('search2').value.trim().toUpperCase();
  if(!qText){ loadAll(); return; }
  const q=query(collectionGroup(db,'bills'), where('huid','==',qText)); const snap=await getDocs(q); render(snap);
}
window.loadAll=async()=>{
  if(!userEmail) return; const snap=await getDocs(collection(db,'jewellery_bills',userEmail,'bills')); render(snap, true);
}
function render(snap, isMain=false){
  let html=''; snap.forEach(d=>{ const b=d.data(); html+=`<div class="bill">${b.photo?`<img src="${b.photo}">`:''}<h3>💎 ${b.iname} - ${b.iweight}</h3><p><b>ग्राहक:</b> ${b.cname} | ${b.cmobile}<br><b>HUID:</b> <span style="color:red;font-size:20px">${b.huid}</span><br><b>रेट:</b> ${b.irate} | Making: ${b.imaking}<br><b>Hallmark:</b> ${b.hallmark}</p></div>`; });
  const el = isMain? document.getElementById('resultMain') : document.getElementById('result');
  if(el) el.innerHTML=html||'<p style="text-align:center">कोई Bill नहीं मिला</p>';
  if(!isMain && document.getElementById('resultMain')) document.getElementById('resultMain').innerHTML=html;
}
function toBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.readAsDataURL(f); r.onload=()=>res(r.result); r.onerror=rej; }); }
</script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#fff8e1;padding:15px}.card{background:white;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:15px}input{width:100%;padding:12px;margin:6px 0;border:1.5px solid #ffb300;border-radius:8px}button{width:100%;padding:14px;background:linear-gradient(45deg,#ff8f00,#ff6f00);color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.btn-green{background:linear-gradient(45deg,#00c853,#009624)}.bill{border:2px solid #ff8f00;border-radius:12px;padding:12px;margin-top:12px;background:white}.bill img{width:100%;max-height:220px;object-fit:contain}</style>
</head>
<body>
<h2 style="text-align:center">💎 Vyapar Bandhu HUID Cloud 💎</h2>
<div id="loginBox" class="card" style="text-align:center"><h3>🔐 Gmail Login करो</h3><button class="btn-green" onclick="login()">Gmail से Login</button><div style="margin-top:20px"><p><b>ग्राहक हो? HUID से Bill देखो</b></p><input id="search" placeholder="🔍 HUID डालो जैसे AB12CD" oninput="searchBill()"><div id="result"></div></div></div>
<div id="mainBox" style="display:none"><p id="userEmail" style="text-align:center;font-weight:bold"></p><button onclick="logout()" style="background:#333">Logout</button><input id="search2" placeholder="🔍 HUID Search - कोई भी मोबाइल से" oninput="searchBill()"><div class="card"><h3>नया Bill</h3><input id="cname" placeholder="ग्राहक नाम"><input id="caddress" placeholder="पता"><input id="cmobile" placeholder="मोबाइल"><input id="iname" placeholder="सामान"><input id="iweight" placeholder="वजन"><input id="irate" placeholder="रेट"><input id="imaking" placeholder="Making"><input id="ihuid" placeholder="HUID"><button class="btn-green" onclick="generateNewHUID()">✨ नया HUID बनाओ - दुनिया में Unique</button><p id="huidStatus"></p><input id="ihallmark" placeholder="Hallmark"><input type="file" id="iphoto" accept="image/*"><button onclick="saveBill()">💾 Cloud में Save</button></div><div id="resultMain"></div></div>
</body>
</html>
