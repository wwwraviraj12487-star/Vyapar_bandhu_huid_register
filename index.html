async function checkReferralAndGiveReward(){
  const urlParams = new URLSearchParams(window.location.search);
  let referrerEmail = urlParams.get('ref');
  if(referrerEmail) localStorage.setItem('vb_ref', referrerEmail);
  else referrerEmail = localStorage.getItem('vb_ref');

  if(!referrerEmail) return;
  referrerEmail = decodeURIComponent(referrerEmail);
  if(referrerEmail === userEmail) return; // Khud ko nahi

  // Kya is user ne pehle hi referral use kiya hai?
  const referralDocRef = doc(db, "referrals", userEmail);
  const referralSnap = await getDoc(referralDocRef);
  if(referralSnap.exists()) return; // Pehle se ho chuka hai

  // Referrer ka wallet badhao - ₹10
  const refWalletRef = doc(db, "wallets", referrerEmail);
  const refWalletSnap = await getDoc(refWalletRef);
  if(refWalletSnap.exists()){
    await updateDoc(refWalletRef, { balance: increment(10) });
  } else {
    await setDoc(refWalletRef, { balance: 10, email: referrerEmail });
  }

    type: 'REFERRAL_EARN',

  await setDoc(referralDocRef, {
    referredBy: referrerEmail,
    referredEmail: userEmail,
    date: new Date().toLocaleString('hi-IN'),
    timestamp: Date.now()
  });
  localStorage.removeItem('vb_ref');
  alert("✅ आपका अकाउंट रेफरल से बना! आपके दोस्त को ₹10 मिल गया (सिर्फ बिल बनाने के लिए)");

  if(!shopProfile){ alert("⚠️ पहले दुकान Setup करो!"); return; }
