<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu ULTIMATE AUTO RESET</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#ff8f00">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, collectionGroup, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAUOfiR4hEdEphcrd5gPtBY1CA5oGP43V8", authDomain: "vyapar-bandhu-huid-rajistard.firebaseapp.com", projectId: "vyapar-bandhu-huid-rajistard", storageBucket: "vyapar-bandhu-huid-rajistard.firebasestorage.app", messagingSenderId: "788156920221", appId: "1:788156920221:web:41b3c9dd4610327fe1ff74" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const RAZORPAY_KEY = "rzp_live_TSSLcwOZn8V7er";
let userEmail=null; let walletBalance=0; let shopProfile=null;

// FIX: Popup use karo, Redirect nahi - yehi error thik karega
window.login=async()=>{
  try{
    const result = await signInWithPopup(auth, provider);
    console.log("Login OK", result.user.email);
  }catch(e){
    alert("Popup Block hai! Upar Allow dabao - "+e.message);
  }
}
window.logout=()=>signOut(auth).then(()=>location.reload());
onAuthStateChanged(auth,async(u)=>{ if(u){ userEmail=u.email; document.getElementById('loginBox').style.display='none'; document.getElementById('mainBox').style.display='block'; document.getElementById('userEmail').innerText='Login: '+userEmail; await loadWallet(); await loadShopProfile(); loadAll(); loadGstLeads(); loadReturnLeads(); } else{ document.getElementById('loginBox').style.display='block'; document.getElementById('mainBox').style.display='none'; } });
async function loadWallet(){ const ref=doc(db,"wallets",userEmail); const snap=await getDoc(ref); if(snap.exists()){ walletBalance=snap.data().balance||0; } else { await setDoc(ref,{balance:0,email:userEmail}); walletBalance=0; } document.getElementById('walletBal').innerText="₹"+walletBalance; document.getElementById('walletBal2').innerText="Balance: ₹"+walletBalance; }
async function loadShopProfile(){ const ref=doc(db,"shops",userEmail); const snap=await getDoc(ref); if(snap.exists()){ shopProfile=snap.data(); document.getElementById('shopDisplay').innerHTML = `<div style="display:flex;align-items:center;gap:10px;background:#fff3cd;padding:10px;border-radius:10px;border:2px solid #ff8f00"><img src="${shopProfile.logo||'logo.png'}" style="width:50px;height:50px;border-radius:50%;object-fit:cover"><div style="text-align:left"><b>${shopProfile.shopName}</b><br><span style="font-size:12px">📞 ${shopProfile.shopMobile}</span><br><span style="font-size:11px">Last Return: ${shopProfile.lastReturnMonth||'अभी तक नहीं'}</span></div><button onclick="editShop()" style="width:auto;margin-left:auto;background:#333;padding:6px 12px;font-size:12px">Edit</button></div>`; document.getElementById('shopSetupCard').style.display='none'; } else { document.getElementById('shopDisplay').innerHTML='<p style="color:red;text-align:center">⚠️ पहले दुकान Setup करो!</p>'; document.getElementById('shopSetupCard').style.display='block'; } }
window.editShop=()=>{ document.getElementById('shopSetupCard').style.display='block'; }
window.saveShopProfile=async()=>{ const shopName=document.getElementById('sname').value.trim(); const shopMobile=document.getElementById('smobile').value.trim(); const shopAddress=document.getElementById('saddress').value.trim(); const shopGst=document.getElementById('sgst').value.trim().toUpperCase(); const shopTin=document.getElementById('stin').value.trim().toUpperCase(); if(!shopName||!shopMobile){ alert('दुकान का नाम और मोबाइल डालो!'); return; } let logo=''; const file=document.getElementById('slogo').files[0]; if(file) logo=await toBase64(file); else if(shopProfile && shopProfile.logo) logo=shopProfile.logo; const data={ shopName, shopMobile, shopAddress, shopGst, shopTin, logo, email:userEmail, updated:new Date().toLocaleString('hi-IN') }; await setDoc(doc(db,'shops',userEmail), data, {merge:true}); shopProfile={...shopProfile,...data}; alert('✅ दुकान Save हो गयी!'); loadShopProfile(); }
window.rechargeWallet=()=>{ const amt=parseInt(document.getElementById('rechargeAmt').value); if(!amt || amt<10){ alert("कम से कम ₹10 डालो"); return; } var options={ "key": RAZORPAY_KEY, "amount": amt*100, "currency": "INR", "name": "Vyapar Bandhu Wallet", "description": "Wallet Recharge ₹"+amt, "handler": async function(response){ const ref=doc(db,"wallets",userEmail); try{ await updateDoc(ref,{balance: increment(amt)}); }catch(e){ await setDoc(ref,{balance:amt,email:userEmail}); } alert("✅ Recharge Success! ₹"+amt+" Add हो गया"); loadWallet(); }, "prefill": { "email": userEmail }, "theme": { "color": "#ff8f00" } }; var rzp=new Razorpay(options); rzp.open(); }
window.payAndCreateGST=async()=>{ const gname=document.getElementById('gstName').value.trim(); const gmobile=document.getElementById('gstMobile').value.trim(); const gmail=document.getElementById('gstEmail').value.trim(); const gstate=document.getElementById('gstState').value.trim(); if(!gname||!gmobile||!gmail){ alert('⚠️ नाम, मोबाइल, Gmail डालो!'); return; } var options={ "key": RAZORPAY_KEY, "amount": 1500*100, "currency": "INR", "name": "Vyapar Bandhu - GST Service", "description": "GST Registration Service ₹1500 (Govt Fee ₹0)", "handler": async function(res){ const leadData={ clientName:gname, clientMobile:gmobile, clientEmail:gmail, state:gstate, pan:document.getElementById('gstPanNo').value, legalName:document.getElementById('gstLegal').value, paymentId:res.razorpay_payment_id, amount:1500, owner:userEmail, date:new Date().toLocaleString('hi-IN'), status:'PAID ₹1500' }; await addDoc(collection(db,'gst_leads',userEmail,'leads'), leadData); alert('✅ ₹1500 Success! अब सरकारी Form खुलेगा!'); window.open('https://reg.gst.gov.in/registration/','_blank'); loadGstLeads(); }, "prefill": { "email": gmail, "contact": gmobile }, "theme": { "color": "#ff8f00" } }; var rzp=new Razorpay(options); rzp.open(); }
async function loadGstLeads(){ if(!userEmail) return; const snap=await getDocs(collection(db,'gst_leads',userEmail,'leads')); let html=`<h4>📋 GST Customers: ${snap.size} - कमाई: ₹${snap.size*1500}</h4>`; snap.forEach(d=>{ const g=d.data(); html+=`<div style="border:1px solid #ff8f00;padding:8px;border-radius:8px;margin:5px 0;background:#fff8e1"><b>${g.clientName}</b> - ${g.clientMobile}</div>`; }); document.getElementById('gstLeadsList').innerHTML=html; }
window.calculateReturn=()=>{ const sale = parseFloat(document.getElementById('retSale').value)||0; const purchase = parseFloat(document.getElementById('retPurchase').value)||0; if(sale==0){ document.getElementById('retCalcResult').innerHTML='<p style="color:red;text-align:center">पहले Sale डालो!</p>'; return; } const gstOnSale = sale * 0.03; const gstOnPurchase = purchase * 0.03; const netGst = gstOnSale - gstOnPurchase; const totalPayGovt = netGst > 0? netGst : 0; document.getElementById('retCalcResult').innerHTML = `<div style="background:#fff8e1;border:2px solid #ff8f00;padding:10px;border-radius:10px"><b style="background:yellow;padding:4px 8px">🏛️ सरकार को: ₹${totalPayGovt.toLocaleString('en-IN')}</b><br><b>Service: ₹500</b><br><b style="color:red">कुल: ₹${(totalPayGovt+500).toLocaleString('en-IN')}</b></div>`; }
window.autoReturnFromHUID=async()=>{ if(!userEmail) return; document.getElementById('retCalcResult').innerHTML='<p style="text-align:center;color:blue">🔍 HUID से हिसाब जोड़ रहा हूँ...</p>'; const shopSnap = await getDoc(doc(db,'shops',userEmail)); let lastTs = 0; if(shopSnap.exists() && shopSnap.data().lastReturnTs){ lastTs = shopSnap.data().lastReturnTs; } const snap = await getDocs(collection(db,'jewellery_bills',userEmail,'bills')); let totalSale = 0; let count = 0; let oldCount = 0; snap.forEach(d=>{ const b = d.data(); const billTs = b.createdAt || 0; if(billTs > lastTs){ let w = parseFloat(b.iweight)||0; let r = parseFloat(b.irate)||0; let m = parseFloat((b.imaking||'0').toString().replace('%',''))||0; let goldValue = w * r; let makingValue = (goldValue * m)/100; totalSale += goldValue + makingValue; count++; } else { oldCount++; } }); document.getElementById('retSale').value = Math.round(totalSale); const gst = totalSale * 0.03; document.getElementById('retCalcResult').innerHTML = `<div style="background:#e8f5e9;border:2px solid #00c853;padding:10px;border-radius:10px"><h4 style="margin:0;color:#00c853">✅ Auto हिसाब बन गया! (पुराना हिसाब 0)</h4><p style="font-size:13px">पुराने Bill: ${oldCount} | नए Bill: ${count}<br>💰 बिक्री: ₹${totalSale.toLocaleString('en-IN')}<br>🏛️ GST: ₹${gst.toLocaleString('en-IN')}</p></div>`; }
window.payAndFileReturn=async()=>{ const gstin=document.getElementById('retGstin').value.trim().toUpperCase(); const retEmail=document.getElementById('retEmail').value.trim(); const retMonth=document.getElementById('retMonth').value; const retType=document.getElementById('retType').value; const saleAmt=document.getElementById('retSale').value; if(!gstin||!retEmail||!retMonth){ alert('⚠️ GSTIN, Email और Month डालो!'); return; } var options={ "key": RAZORPAY_KEY, "amount": 500*100, "currency": "INR", "name": "Vyapar Bandhu - GST Return", "description": "Return Service ₹500", "handler": async function(res){ const data={ gstin, email:retEmail, mobile:document.getElementById('retMobile').value, month:retMonth, type:retType, sale:saleAmt, purchase:document.getElementById('retPurchase').value, paymentId:res.razorpay_payment_id, amount:500, owner:userEmail, date:new Date().toLocaleString('hi-IN'), status:'PAID ₹500' }; await addDoc(collection(db,'gst_returns',userEmail,'returns'), data); await setDoc(doc(db,'shops',userEmail), { lastReturnTs: Date.now(), lastReturnMonth: retMonth }, {merge:true}); alert('✅ ₹500 Success! Return File हो गया! पुराना हिसाब 0!'); window.open('https://services.gst.gov.in/services/login','_blank'); loadReturnLeads(); loadShopProfile(); }, "prefill": { "email": retEmail, "contact": document.getElementById('retMobile').value }, "theme": { "color": "#1976d2" } }; var rzp=new Razorpay(options); rzp.open(); }
async function loadReturnLeads(){ if(!userEmail) return; const snap=await getDocs(collection(db,'gst_returns',userEmail,'returns')); let html=`<h4>📊 Return Customers: ${snap.size} - कमाई: ₹${snap.size*500}</h4>`; snap.forEach(d=>{ const r=d.data(); html+=`<div style="border:1px solid #1976d2;padding:8px;border-radius:8px;margin:5px 0;background:#e3f2fd"><b>${r.gstin}</b> - ${r.month}</div>`; }); document.getElementById('returnLeadsList').innerHTML=html; }
window.generateNewHUID=()=>{ if(!shopProfile){ alert("⚠️ पहले दुकान Setup करो!"); return; } if(walletBalance<20){ alert("⚠️ Balance कम है!"); return; } let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let newHuid=''; for(let i=0;i<6;i++) newHuid+=chars[Math.floor(Math.random()*chars.length)]; document.getElementById('ihuid').value=newHuid; document.getElementById('huidStatus').innerHTML='✅ नया HUID: <b style="color:red;font-size:20px">'+newHuid+'</b>'; }
window.saveBill=async()=>{ if(!shopProfile){ alert("⚠️ पहले दुकान Setup करो!"); return; } const huid=document.getElementById('ihuid').value.trim().toUpperCase(); if(!huid){alert('HUID बनाओ!');return} if(walletBalance<20){ alert("Balance कम है!"); return; } const file=document.getElementById('iphoto').files[0]; let photo=''; if(file) photo=await toBase64(file); let makingRaw = document.getElementById('imaking').value.replace('%','').trim(); const data={ cname:cname.value, caddress:caddress.value, cmobile:cmobile.value, iname:iname.value, iweight:iweight.value, irate:irate.value, imaking:makingRaw, huid:huid, hallmark:ihallmark.value, karat:ikarat.value, shopName:shopProfile.shopName, shopMobile:shopProfile.shopMobile, shopAddress:shopProfile.shopAddress, shopGst:shopProfile.shopGst, shopLogo:shopProfile.logo, photo:photo, date:new Date().toLocaleString('hi-IN'), createdAt: Date.now(), owner:userEmail }; await setDoc(doc(db,'jewellery_bills',userEmail,'bills',huid), data); const ref=doc(db,"wallets",userEmail); try{ await updateDoc(ref,{balance: increment(-20)}); }catch(e){ await setDoc(ref,{balance:walletBalance-20,email:userEmail}); } walletBalance-=20; document.getElementById('walletBal').innerText="₹"+walletBalance; document.getElementById('walletBal2').innerText="Balance: ₹"+walletBalance; alert('✅ Save! ₹20 kat gaya!'); loadAll(); }
window.searchBill=async()=>{ let qText = (document.getElementById('search')?.value || document.getElementById('search2')?.value || "").trim().toUpperCase(); if(!qText){ alert('HUID डालो!'); return; } const q=query(collectionGroup(db,'bills'), where('huid','==',qText)); const snap=await getDocs(q); render(snap); }
window.loadAll=async()=>{ if(!userEmail) return; const snap=await getDocs(collection(db,'jewellery_bills',userEmail,'bills')); render(snap, true); }
function render(snap, isMain=false){ let html=''; snap.forEach(d=>{ const b=d.data(); let cleanMaking = (b.imaking||'').toString().replace(/%/g,''); const karatBadge = b.karat? `<span style="background:#ff8f00;color:white;padding:3px 10px;border-radius:15px;font-size:12px">${b.karat}</span>` : ''; html+=`<div class="bill"><h3>💎 ${b.iname} - ${b.iweight} ${karatBadge}</h3><p><b>HUID:</b> <span style="color:red;font-size:20px">${b.huid}</span><br><b>ग्राहक:</b> ${b.cname}</p></div>`; }); const el = isMain? document.getElementById('resultMain') : document.getElementById('result'); if(el) el.innerHTML=html||'<p style="text-align:center;color:red">❌ कोई Bill नहीं मिला</p>'; }
function toBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.readAsDataURL(f); r.onload=()=>res(r.result); r.onerror=rej; }); }
</script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#fff8e1;padding:0}.top-banner{background:linear-gradient(135deg,#ff8f00,#e65100);color:white;padding:18px 12px;text-align:center}.main-content{padding:12px}.card{background:white;padding:14px;border-radius:14px;box-shadow:0 5px 15px rgba(0,0,0,.1);margin-bottom:14px}input,select{width:100%;padding:11px;margin:5px 0;border:1.5px solid #ffb300;border-radius:8px}button{width:100%;padding:13px;background:linear-gradient(45deg,#ff8f00,#ff6f00);color:white;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}.btn-green{background:linear-gradient(45deg,#00c853,#009624)}.btn-blue{background:linear-gradient(45deg,#1976d2,#0d47a1)}.bill{border:2px solid #ff8f00;border-radius:12px;padding:10px;margin-top:10px;background:white}.wallet{background:linear-gradient(135deg,#00c853,#009624);color:white;padding:14px;border-radius:14px;margin-bottom:14px;text-align:center}.search-row{display:flex;gap:8px;align-items:center}.gst-card{border:3px solid #e65100}.return-card{border:3px solid #1976d2}</style>
</head>
<body>
<div class="top-banner"><h1>💎 VYAPAR BANDHU AUTO RESET</h1><p>HUID + GST + RETURN AUTO 0</p></div>
<div class="main-content">
<h2 style="text-align:center;margin:8px 0">💎 Vyapar Bandhu - All Set 💎</h2>
<div id="loginBox" class="card" style="text-align:center">
  <h3>🔐 Gmail Login करो</h3>
  <button class="btn-green" onclick="login()">Gmail से Login</button>
  <div style="margin-top:15px"><p><b>ग्राहक हो? HUID से Bill देखो</b></p><div class="search-row"><input id="search" placeholder="🔍 HUID डालो" style="flex:1;margin:0"><button onclick="searchBill()" style="width:90px;margin:0;background:#1976d2">Search</button></div><div id="result"></div></div>
</div>
<div id="mainBox" style="display:none">
  <p id="userEmail" style="text-align:center;font-weight:bold"></p>
  <div id="shopDisplay" class="card"></div>
  <div id="shopSetupCard" class="card" style="border:3px solid #1976d2"><h3>🏪 दुकान Setup</h3><input id="sname" placeholder="🏪 दुकान का नाम *"><input id="smobile" placeholder="📞 मोबाइल *"><input id="saddress" placeholder="📍 पता"><input id="sgst" placeholder="📄 GST No."><input id="stin" placeholder="🧾 TIN"><input type="file" id="slogo" accept="image/*"><button class="btn-blue" onclick="saveShopProfile()">💾 Save</button></div>
  <div class="wallet"><h3>💰 Wallet Balance</h3><h1 id="walletBal" style="font-size:32px;margin:5px 0">₹0</h1><div style="display:flex;gap:8px;margin-top:8px;background:white;border-radius:10px;padding:5px"><input id="rechargeAmt" type="number" placeholder="100" style="flex:1;margin:0;border:none;color:black"><button onclick="rechargeWallet()" style="width:90px;margin:0;background:black">Recharge</button></div></div>
  <div class="card gst-card"><h2 style="text-align:center;color:#e65100">🆕 नया GST बनवाएं - ₹1500 में</h2><input id="gstName" placeholder="👤 नाम *"><input id="gstMobile" placeholder="📞 Mobile *"><input id="gstEmail" placeholder="📧 Gmail *"><input id="gstLegal" placeholder="🏪 Business नाम"><input id="gstPanNo" placeholder="PAN"><input id="gstState" placeholder="State"><button class="btn-green" onclick="payAndCreateGST()">💰 ₹1500 Pay करो</button><div id="gstLeadsList"></div></div>
  <div class="card return-card"><h2 style="text-align:center;color:#0d47a1">📊 GST Return File - ₹500 + AUTO RESET</h2><button onclick="autoReturnFromHUID()" style="background:linear-gradient(45deg,#00c853,#009624)">🤖 HUID से Auto हिसाब बनाओ (पुराना 0)</button><input id="retSale" type="number" placeholder="💰 बेचा?"><input id="retPurchase" type="number" placeholder="🛒 खरीदा?"><button onclick="calculateReturn()" style="background:#ff8f00">🧮 हिसाब निकालो</button><div id="retCalcResult"></div><input id="retGstin" placeholder="📄 GSTIN *"><input id="retEmail" placeholder="📧 Gmail *"><input id="retMobile" placeholder="📞 Mobile *"><select id="retType"><option>GSTR-3B - Monthly</option><option>GSTR-1 - Monthly</option></select><select id="retMonth"><option value="">-- महीना चुनो --</option><option>August 2026</option><option>September 2026</option></select><button class="btn-blue" onclick="payAndFileReturn()">💳 ₹500 Pay करो - Return File</button><div id="returnLeadsList"></div></div>
  <button onclick="logout()" style="background:#333">Logout</button>
  <div class="search-row" style="margin-top:12px"><input id="search2" placeholder="🔍 HUID Search" style="flex:1;margin:0"><button onclick="searchBill()" style="width:90px;margin:0;background:#1976d2">Search</button></div>
  <div class="card"><h3>नया Bill - <span id="walletBal2">Balance: ₹0</span></h3><input id="cname" placeholder="ग्राहक नाम"><input id="caddress" placeholder="पता"><input id="cmobile" placeholder="मोबाइल"><input id="iname" placeholder="सामान"><input id="iweight" placeholder="वजन"><select id="ikarat"><option value="">-- कैरेट --</option><option value="24K (999)">24K (999)</option><option value="22K (916)">22K (916)</option></select><input id="irate" placeholder="रेट"><input id="imaking" placeholder="Making %"><input id="ihuid" placeholder="HUID" readonly style="background:#fff3cd"><button class="btn-green" onclick="generateNewHUID()">✨ नया HUID बनाओ (₹20)</button><p id="huidStatus"></p><input id="ihallmark" placeholder="Hallmark"><input type="file" id="iphoto" accept="image/*"><button onclick="saveBill()">💾 Save</button></div>
  <div id="resultMain"></div>
</div>
</div>
</body>
</html>
